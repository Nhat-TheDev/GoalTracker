<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1050" height="1150" fill="#ffffff"/>

  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#33403a"/>
    </marker>
  </defs>

  <!-- A: session ends (pill) -->
  <rect x="300" y="20" width="300" height="55" rx="27" fill="#7c8a90"/>
  <text x="450" y="53" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Agent A's session ends</text>

  <!-- dashed line A -> B with 2-line label -->
  <path d="M 450,75 L 450,152" stroke="#1f7a6c" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow2)"/>
  <text x="470" y="102" font-size="12.5" font-style="italic" fill="#1f7a6c">context reset —</text>
  <text x="470" y="118" font-size="12.5" font-style="italic" fill="#1f7a6c">Agent B, zero memory of any of this</text>

  <!-- B -->
  <rect x="290" y="155" width="320" height="70" rx="8" fill="#1f7a6c"/>
  <text x="450" y="184" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">goal_list()</text>
  <text x="450" y="205" font-size="13" fill="#ffffff" text-anchor="middle">finds the active goal</text>

  <!-- line B -> C -->
  <path d="M 450,225 L 450,267" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- C -->
  <rect x="270" y="270" width="360" height="80" rx="8" fill="#1f7a6c"/>
  <text x="450" y="302" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">goal_get_context()</text>
  <text x="450" y="325" font-size="13" fill="#ffffff" text-anchor="middle">recovers everything in one call</text>

  <!-- line C -> D (annotation) -->
  <path d="M 630,310 L 697,310" stroke="#1f7a6c" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- D: annotation card (dashed border, distinct from action boxes) -->
  <rect x="700" y="250" width="300" height="120" rx="8" fill="#ffffff" stroke="#1f7a6c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="850" y="282" font-size="13.5" font-weight="700" fill="#1f7a6c" text-anchor="middle">One call returns:</text>
  <text x="850" y="308" font-size="13" fill="#16211d" text-anchor="middle">milestones + progress +</text>
  <text x="850" y="330" font-size="13" fill="#16211d" text-anchor="middle">why M2 is blocked</text>

  <!-- line C -> E -->
  <path d="M 450,350 L 450,397" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- E -->
  <rect x="280" y="400" width="340" height="75" rx="8" fill="#c2591e"/>
  <text x="450" y="431" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent B reports status,</text>
  <text x="450" y="454" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">asks: which push provider?</text>

  <!-- line E -> F -->
  <path d="M 450,475 L 450,522" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- F: user picks a provider (pill) -->
  <rect x="300" y="525" width="300" height="55" rx="27" fill="#7c8a90"/>
  <text x="450" y="558" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">User picks a provider</text>

  <!-- line F -> G -->
  <path d="M 450,580 L 450,627" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- G -->
  <rect x="260" y="630" width="380" height="80" rx="8" fill="#2e6f9e"/>
  <text x="450" y="662" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Finishes the blocked task</text>
  <text x="450" y="685" font-size="13" fill="#ffffff" text-anchor="middle">task_update_status → completed</text>

  <!-- line G -> H -->
  <path d="M 450,710 L 450,757" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- H -->
  <rect x="250" y="760" width="400" height="80" rx="8" fill="#2e6f9e"/>
  <text x="450" y="792" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Finds + finishes the next task</text>
  <text x="450" y="815" font-size="13" fill="#ffffff" text-anchor="middle">task_list → work → completed</text>

  <!-- line H -> I -->
  <path d="M 450,840 L 450,887" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- I -->
  <rect x="280" y="890" width="340" height="75" rx="8" fill="#2f7d5c"/>
  <text x="450" y="921" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">status_report</text>
  <text x="450" y="944" font-size="13" fill="#ffffff" text-anchor="middle">verify acceptance criteria</text>

  <!-- line I -> J -->
  <path d="M 450,965 L 450,1012" stroke="#33403a" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- J -->
  <rect x="290" y="1015" width="320" height="75" rx="8" fill="#2f7d5c"/>
  <text x="450" y="1046" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">goal_update_status</text>
  <text x="450" y="1069" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">("completed")</text>
</svg>
